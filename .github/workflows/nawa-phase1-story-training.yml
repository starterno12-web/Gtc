name: Phase 1 - Nawa Story Repetition Training
on:
  workflow_dispatch:
  push:
    paths:
      - 'training/nawa_phase1_story.txt'
permissions:
  contents: write
concurrency:
  group: nawa-phase1-story
  cancel-in-progress: false
jobs:
  train-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Kotlin harness
        run: python training/run_nawa_phase1.py
      - name: Read and train on story 50 times (no model questioning)
        run: cd runner && gradle --no-daemon run
      - name: Persist trained weights to repository with retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training/model/nlm2_user.bin training/model/results_phase1.txt
          git commit -m 'Persist Phase 1 story-trained NLM weights'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; echo 'Rebase conflict: refusing to overwrite remote model files.'; exit 1; }
            if git push origin HEAD:main; then
              echo 'Trained weights and report committed to main.'
              exit 0
            fi
            echo "Push attempt ${attempt} rejected; retrying after fetching/rebasing."
          done
          echo 'Failed to persist weights after 3 push attempts.'
          exit 1
      - name: Upload training results as backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nawa-phase1-training-output
          path: |
            training/model/nlm2_user.bin
            training/model/results_phase1.txt
          if-no-files-found: warn
