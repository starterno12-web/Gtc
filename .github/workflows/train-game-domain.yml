name: Train focused game-development language model
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        default: "30"
        type: string
  workflow_run:
    workflows: ["Unpack package and build"]
    types: [completed]
permissions:
  contents: read
jobs:
  train-domain:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       !contains(github.event.workflow_run.head_commit.message, '[domain-train]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training dependency
        run: pip install torch
      - name: Train
        run: python training/train_domain_gru.py --epochs "${{ github.event.inputs.epochs || '30' }}"
      - name: Upload best checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: game-domain-gru-checkpoint
          path: training/checkpoints/game_domain_gru.pt
          retention-days: 30
