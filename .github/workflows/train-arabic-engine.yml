name: Arabic Engine Training

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs"
        required: true
        default: "15"
        type: string
      learning_rate:
        description: "Learning rate"
        required: true
        default: "0.0004"
        type: string

permissions:
  contents: write

concurrency:
  group: arabic-engine-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download corpus from Google Drive
        env:
          DRIVE_FILE_ID: 1g7SnmYAI7nlzIXo2XqGFUAO9KwtlFI6q
        run: |
          set -euo pipefail
          python -m pip install --upgrade "gdown>=5.2,<6"
          mkdir -p .training-tmp
          DRIVE_URL="https://drive.google.com/uc?id=${DRIVE_FILE_ID}"
          OUTPUT=".training-tmp/corpus"

          downloaded=false
          for attempt in 1 2 3; do
            echo "Google Drive download attempt ${attempt}/3..."
            rm -f "$OUTPUT"
            if gdown --fuzzy "$DRIVE_URL" --output "$OUTPUT" && [ -s "$OUTPUT" ]; then
              downloaded=true
              break
            fi
            echo "Download attempt ${attempt} failed."
            sleep $((attempt * 10))
          done

          if [ "$downloaded" != true ]; then
            echo "::error::Google Drive download failed after 3 attempts. Check that the Drive file exists and is shared as 'Anyone with the link – Viewer'."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          p = Path(".training-tmp/corpus")
          with p.open("rb") as f:
              head = f.read(1024).lstrip().lower()
          if head.startswith((b"<!doctype html", b"<html")):
              raise SystemExit("Google Drive returned an HTML access/confirmation page instead of the corpus. Check public link permissions and file sharing.")
          print(f"Downloaded {p.stat().st_size:,} bytes.")
          PY
          echo "Downloaded corpus ($(du -h "$OUTPUT" | cut -f1))."

      - name: Validate corpus as text
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.training-tmp/corpus')
          data = p.read_bytes()
          if not data:
              raise SystemExit('Corpus download is empty.')
          try:
              text = data.decode('utf-8-sig')
          except UnicodeDecodeError as e:
              raise SystemExit(f'Corpus is not valid UTF-8 text: {e}')
          if len(text.strip()) < 1000:
              raise SystemExit('Corpus is too short to train.')
          print(f'Validated UTF-8: {len(data):,} bytes, {len(text):,} characters.')
          PY

      - name: Confirm real engine training adapter is present
        run: |
          set -euo pipefail
          if [ ! -f training/runner.py ]; then
            echo '::error::Training halted safely: Android Kotlin engine source is present, but no portable training adapter training/runner.py exists. Corpus download/validation succeeded; no training or fake weights were produced.'
            exit 1
          fi

      - name: Train model and produce weights
        run: |
          set -euo pipefail
          python training/runner.py train \
            --corpus .training-tmp/corpus \
            --epochs "${{ inputs.epochs }}" \
            --learning-rate "${{ inputs.learning_rate }}" \
            --output weights/nlm2.bin \
            --report training-report.json

      - name: Verify generated NLM2 weights
        run: |
          set -euo pipefail
          test -s weights/nlm2.bin
          python training/runner.py verify --weights weights/nlm2.bin

      - name: Run Arabic QA probes (80 questions)
        run: |
          set -euo pipefail
          python training/runner.py qa \
            --weights weights/nlm2.bin \
            --questions training/qa_questions.json \
            --minimum-questions 80 \
            --report qa-report.json
          test -s qa-report.json

      - name: Commit verified weights and reports to repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weights/nlm2.bin training-report.json qa-report.json
          git diff --cached --quiet && { echo 'No verified changes to commit.'; exit 0; }
          git commit -m 'Save verified trained NLM2 weights and QA report'
          git push

      - name: Cleanup temporary corpus (always)
        if: always()
        run: |
          rm -rf .training-tmp
          echo 'Temporary corpus deleted.'
