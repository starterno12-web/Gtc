name: Arabic Engine Training

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs"
        required: true
        default: "15"
        type: string
      learning_rate:
        description: "Learning rate"
        required: true
        default: "0.0004"
        type: string

permissions:
  contents: write

concurrency:
  group: arabic-engine-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download corpus from Google Drive
        env:
          DRIVE_FILE_ID: 1g7SnmYAI7nlzIXo2XqGFUAO9KwtlFI6q
        run: |
          set -euo pipefail
          python -m pip install --upgrade "gdown>=5.2,<6"
          mkdir -p .training-tmp
          DRIVE_URL="https://drive.google.com/uc?id=${DRIVE_FILE_ID}"
          OUTPUT=".training-tmp/corpus"

          downloaded=false
          for attempt in 1 2 3; do
            echo "Google Drive download attempt ${attempt}/3..."
            rm -f "$OUTPUT"
            if gdown --fuzzy "$DRIVE_URL" --output "$OUTPUT" && [ -s "$OUTPUT" ]; then
              downloaded=true
              break
            fi
            echo "Download attempt ${attempt} failed."
            sleep $((attempt * 10))
          done

          if [ "$downloaded" != true ]; then
            echo "::error::Google Drive download failed after 3 attempts. Check that the Drive file exists and is shared as 'Anyone with the link – Viewer'."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          p = Path(".training-tmp/corpus")
          with p.open("rb") as f:
              head = f.read(1024).lstrip().lower()
          if head.startswith((b"<!doctype html", b"<html")):
              raise SystemExit("Google Drive returned an HTML access/confirmation page instead of the corpus. Check public link permissions and file sharing.")
          print(f"Downloaded {p.stat().st_size:,} bytes.")
          PY
          echo "Downloaded corpus ($(du -h "$OUTPUT" | cut -f1))."

      - name: Validate corpus as text
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.training-tmp/corpus')
          data = p.read_bytes()
          if not data:
              raise SystemExit('Corpus download is empty.')
          try:
              text = data.decode('utf-8-sig')
          except UnicodeDecodeError as e:
              raise SystemExit(f'Corpus is not valid UTF-8 text: {e}')
          if len(text.strip()) < 1000:
              raise SystemExit('Corpus is too short to train.')
          print(f'Validated UTF-8: {len(data):,} bytes, {len(text):,} characters.')
          PY

      - name: Set up Java for the Kotlin engine
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the actual Kotlin Nlm engine adapter
        run: |
          set -euo pipefail
          gradle -p training/engine --no-daemon build

      - name: Train the actual Kotlin GRU engine and produce NLM2 weights
        run: |
          set -euo pipefail
          OUTPUT_WEIGHTS="$GITHUB_WORKSPACE/nlm2.bin"
          mkdir -p "$GITHUB_WORKSPACE"
          gradle -p training/engine --no-daemon run --args="train --corpus $GITHUB_WORKSPACE/.training-tmp/corpus --epochs ${{ inputs.epochs }} --learning-rate ${{ inputs.learning_rate }} --output $GITHUB_WORKSPACE/nlm2.bin --report $GITHUB_WORKSPACE/training-report.json"

      - name: Verify generated NLM2 weights with the same Kotlin engine
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/nlm2.bin"
          sha256sum "$GITHUB_WORKSPACE/nlm2.bin"
          gradle -p training/engine --no-daemon run --args="verify --weights $GITHUB_WORKSPACE/nlm2.bin"

      - name: Run Arabic QA probes (80 questions, character-model metric)
        run: |
          set -euo pipefail
          gradle -p training/engine --no-daemon run --args="qa --weights $GITHUB_WORKSPACE/nlm2.bin --questions $GITHUB_WORKSPACE/training/qa_questions.json --minimum-questions 80 --report $GITHUB_WORKSPACE/qa-report.json"
          test -s "$GITHUB_WORKSPACE/qa-report.json"

      - name: Generate visible answers for simple Arabic smoke questions
        run: |
          set -euo pipefail
          gradle -p training/engine --no-daemon run --args="qa --weights $GITHUB_WORKSPACE/nlm2.bin --questions $GITHUB_WORKSPACE/training/smoke_questions.json --minimum-questions 16 --report $GITHUB_WORKSPACE/smoke-test-report.json"
          test -s "$GITHUB_WORKSPACE/smoke-test-report.json"
          echo "Generated answers:"
          cat "$GITHUB_WORKSPACE/smoke-test-report.json"

      - name: Commit verified weights and reports to repository root
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nlm2.bin training-report.json qa-report.json smoke-test-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save trained NLM2 weights and Arabic smoke-test outputs'
            git push origin HEAD:main
          else
            echo 'Weights and reports are unchanged; verifying the already committed root weights.'
          fi
          git fetch origin main
          LOCAL_BLOB="$(git hash-object "$GITHUB_WORKSPACE/nlm2.bin")"
          REMOTE_BLOB="$(git rev-parse origin/main:nlm2.bin)"
          test "$LOCAL_BLOB" = "$REMOTE_BLOB"
          git ls-tree -l origin/main nlm2.bin
          echo "Confirmed: root/nlm2.bin is committed on origin/main (blob $REMOTE_BLOB)."


      - name: Cleanup temporary corpus (always)
        if: always()
        run: |
          rm -rf .training-tmp
          echo 'Temporary corpus deleted.'
