name: Arabic Engine Training

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs"
        required: true
        default: "15"
        type: string
      learning_rate:
        description: "Learning rate"
        required: true
        default: "0.0004"
        type: string

permissions:
  contents: write

concurrency:
  group: arabic-engine-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download corpus from Google Drive
        env:
          DRIVE_FILE_ID: 1g7SnmYAI7nlzIXo2XqGFUAO9KwtlFI6q
        run: |
          set -euo pipefail
          python -m pip install --upgrade "gdown>=5.2,<6"
          mkdir -p .training-tmp
          DRIVE_URL="https://drive.google.com/uc?id=${DRIVE_FILE_ID}"
          OUTPUT=".training-tmp/corpus"

          downloaded=false
          for attempt in 1 2 3; do
            echo "Google Drive download attempt ${attempt}/3..."
            rm -f "$OUTPUT"
            if gdown --fuzzy "$DRIVE_URL" --output "$OUTPUT" && [ -s "$OUTPUT" ]; then
              downloaded=true
              break
            fi
            echo "Download attempt ${attempt} failed."
            sleep $((attempt * 10))
          done

          if [ "$downloaded" != true ]; then
            echo "::error::Google Drive download failed after 3 attempts. Check that the Drive file exists and is shared as 'Anyone with the link – Viewer'."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          p = Path(".training-tmp/corpus")
          with p.open("rb") as f:
              head = f.read(1024).lstrip().lower()
          if head.startswith((b"<!doctype html", b"<html")):
              raise SystemExit("Google Drive returned an HTML access/confirmation page instead of the corpus. Check public link permissions and file sharing.")
          print(f"Downloaded {p.stat().st_size:,} bytes.")
          PY
          echo "Downloaded corpus ($(du -h "$OUTPUT" | cut -f1))."

      - name: Validate corpus as text
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.training-tmp/corpus')
          data = p.read_bytes()
          if not data:
              raise SystemExit('Corpus download is empty.')
          try:
              text = data.decode('utf-8-sig')
          except UnicodeDecodeError as e:
              raise SystemExit(f'Corpus is not valid UTF-8 text: {e}')
          if len(text.strip()) < 1000:
              raise SystemExit('Corpus is too short to train.')
          print(f'Validated UTF-8: {len(data):,} bytes, {len(text):,} characters.')
          PY

      - name: Download extra temporary TXT corpus from Google Drive
        env:
          EXTRA_DRIVE_FILE_ID: 1ChmGsq0gCoJdH6oLBXaeRoSlG9hTB7B3
        run: |
          set -euo pipefail
          EXTRA_URL="https://drive.google.com/uc?id=${EXTRA_DRIVE_FILE_ID}"
          EXTRA_OUTPUT=".training-tmp/extra-corpus.txt"
          downloaded=false
          for attempt in 1 2 3; do
            echo "Extra TXT download attempt ${attempt}/3..."
            rm -f "$EXTRA_OUTPUT"
            if gdown --fuzzy "$EXTRA_URL" --output "$EXTRA_OUTPUT" && [ -s "$EXTRA_OUTPUT" ]; then
              downloaded=true
              break
            fi
            echo "Extra download attempt failed."
            sleep $((attempt * 10))
          done
          if [ "$downloaded" != true ]; then
            echo "::error::Failed to download extra corpus from Google Drive after 3 attempts."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('.training-tmp/extra-corpus.txt')
          data = p.read_bytes()
          if data.lstrip().lower().startswith((b'<!doctype html', b'<html')):
              raise SystemExit('Drive returned HTML, not the TXT file. Check sharing permissions.')
          text = data.decode('utf-8-sig')
          if len(text.strip()) < 1000:
              raise SystemExit('Extra TXT is too short to be useful as a corpus.')
          base = Path('.training-tmp/corpus').read_text(encoding='utf-8-sig')
          merged = base.rstrip() + '\n\n' + text.lstrip()
          Path('.training-tmp/combined-corpus.txt').write_text(merged, encoding='utf-8')
          print(f'Extra TXT: {len(text):,} chars; combined corpus: {len(merged):,} chars.')
          PY

      - name: Download new temporary training TXT from Google Drive and merge
        env:
          NEW_DRIVE_FILE_ID: 1v85GDSaVVWGCgnRUpOceWwqk_x20F1HR
        run: |
          set -euo pipefail
          URL="https://drive.google.com/uc?id=${NEW_DRIVE_FILE_ID}"
          OUTPUT=".training-tmp/new-corpus.txt"
          downloaded=false
          for attempt in 1 2 3; do
            echo "New corpus download attempt ${attempt}/3..."
            rm -f "$OUTPUT"
            if gdown --fuzzy "$URL" --output "$OUTPUT" && [ -s "$OUTPUT" ]; then
              downloaded=true
              break
            fi
            sleep $((attempt * 10))
          done
          if [ "$downloaded" != true ]; then
            echo "::error::Failed to download new corpus from Google Drive."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('.training-tmp/new-corpus.txt')
          raw = p.read_bytes()
          if raw.lstrip().lower().startswith((b'<!doctype html', b'<html')):
              raise SystemExit('Drive returned HTML instead of text.')
          text = raw.decode('utf-8-sig')
          if len(text.strip()) < 1000:
              raise SystemExit('New TXT corpus is too short.')
          combined_path = Path('.training-tmp/combined-corpus.txt')
          base = combined_path.read_text(encoding='utf-8')
          combined_path.write_text(base.rstrip() + '\n\n' + text.lstrip(), encoding='utf-8')
          print(f'New TXT validated: {len(text):,} chars; merged training corpus: {len(base)+len(text):,} chars.')
          PY

      - name: Create QA questions including geometry, physics, and 5 random corpus excerpts
        run: |
          set -euo pipefail
          cat > .training-tmp/general-questions.json <<'JSON'
          [
            {"id":1,"question":"ما عاصمة المملكة العربية السعودية؟"},
            {"id":2,"question":"كم عدد أيام الأسبوع؟"},
            {"id":3,"question":"ما الكوكب الذي نعيش عليه؟"},
            {"id":4,"question":"ما مصدر الضوء والحرارة الرئيسي للأرض؟"},
            {"id":5,"question":"ما الغاز الذي يحتاجه الإنسان للتنفس؟"},
            {"id":6,"question":"ما وظيفة القلب في جسم الإنسان؟"},
            {"id":7,"question":"ما المقصود بالماء؟"},
            {"id":8,"question":"لماذا تتبخر المياه عند تسخينها؟"},
            {"id":9,"question":"ما الحيوان المعروف بسفينة الصحراء؟"},
            {"id":10,"question":"ما فائدة جذور النباتات؟"},
            {"id":11,"question":"ما المقصود بالبناء الضوئي؟"},
            {"id":12,"question":"ما أكبر محيط على سطح الأرض؟"},
            {"id":13,"question":"ما اللغة الرسمية في المملكة العربية السعودية؟"},
            {"id":14,"question":"ما العملة المستخدمة في السعودية؟"},
            {"id":15,"question":"ما معنى التعاون؟"},
            {"id":16,"question":"كيف يساعد تنظيم الوقت على إنجاز المهام؟"},
            {"id":17,"question":"ما المقصود بالتعلم؟"},
            {"id":18,"question":"ما الفرق بين البيانات والمعلومات؟"},
            {"id":19,"question":"ما وظيفة نظام التشغيل في الحاسوب؟"},
            {"id":20,"question":"ما المقصود بالإنترنت؟"},
            {"id":21,"question":"ما هي الخوارزمية؟"},
            {"id":22,"question":"ما فائدة الاختبارات في البرمجة؟"},
            {"id":23,"question":"ما معنى المصدر المفتوح في البرمجيات؟"},
            {"id":24,"question":"كيف نحافظ على نظافة البيئة؟"},
            {"id":25,"question":"لماذا يجب الالتزام بإشارات المرور؟"},
            {"id":26,"question":"ما فائدة ممارسة الرياضة بانتظام؟"},
            {"id":27,"question":"كيف نتحقق من صحة خبر على الإنترنت؟"},
            {"id":28,"question":"ما معنى احترام الآخرين؟"},
            {"id":29,"question":"ما المقصود بالهدف؟"},
            {"id":30,"question":"كيف يمكن تعلم مهارة جديدة بشكل تدريجي؟"},
            {"id":31,"question":"ما الأشكال الهندسية الأساسية؟"},
            {"id":32,"question":"ما شكل المكعب وما خصائصه؟"},
            {"id":33,"question":"علمني أساسيات الفيزياء."},
            {"id":34,"question":"دربني على الفيزياء بسؤال وتمرين."}
          ]
          JSON
          python - <<'PY'
          import json, random, re
          from pathlib import Path
          qpath = Path('.training-tmp/general-questions.json')
          questions = json.loads(qpath.read_text(encoding='utf-8'))
          source = Path('.training-tmp/new-corpus.txt').read_text(encoding='utf-8-sig')
          # Randomly sample sentence-like excerpts from the new source as additional corpus-grounded probes.
          excerpts = [s.strip() for s in re.split(r'(?<=[.!؟?])\s+|\n+', source) if len(s.strip()) >= 45]
          if len(excerpts) < 5:
              excerpts = [source[i:i+240].strip() for i in range(0, len(source), max(1, len(source)//10)) if len(source[i:i+240].strip()) >= 45]
          if len(excerpts) < 5:
              raise SystemExit('Could not select five usable excerpts from the new corpus.')
          random.Random(20261123).shuffle(excerpts)
          for qid, excerpt in enumerate(excerpts[:5], start=35):
              excerpt = re.sub(r'\s+', ' ', excerpt)[:240]
              questions.append({"id": qid, "question": "ما الفكرة أو المعلومة الواردة في هذا المقطع؟ " + excerpt})
          qpath.write_text(json.dumps(questions, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          assert len(questions) == 39 and len({q['id'] for q in questions}) == 39
          print('Prepared 39 probes: 30 existing, 4 geometry/physics, and 5 randomized excerpt probes.')
          base_pairs = json.loads(Path('training/conversation_pairs.json').read_text(encoding='utf-8'))
          base_pairs.extend([
            {"question":"ما الأشكال الهندسية الأساسية؟","answer":"من الأشكال الهندسية الأساسية: المثلث، والمربع، والمستطيل، والدائرة. وتوجد أيضًا أشكال ثلاثية الأبعاد مثل المكعب والكرة والأسطوانة."},
            {"question":"ما شكل المكعب وما خصائصه؟","answer":"المكعب شكل ثلاثي الأبعاد له 6 أوجه مربعة متساوية، و12 حرفًا، و8 رؤوس."},
            {"question":"علمني أساسيات الفيزياء.","answer":"الفيزياء علم يدرس المادة والطاقة والحركة والقوى. مثال: القوة قد تغير سرعة جسم أو اتجاهه. درسنا الأول: إذا دفعت كرة فإن القوة تجعلها تتحرك. تمرين: ماذا يحدث لسرعة الكرة إذا دفعتها بقوة أكبر، مع ثبات الظروف؟"},
            {"question":"دربني على الفيزياء بسؤال وتمرين.","answer":"تدريب فيزياء 1: مفهوم السرعة. السرعة = المسافة ÷ الزمن. مثال: قطعت سيارة 100 متر في 20 ثانية؛ سرعتها 5 متر/ثانية. دورك: جسم قطع 60 مترًا خلال 12 ثانية، احسب سرعته."}
          ])
          Path('.training-tmp/conversations-with-geometry-physics.json').write_text(json.dumps(base_pairs, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')
          assert len(base_pairs) == 354
          print('Added four geometry/physics supervised pairs to a temporary training conversation dataset.')
          PY
      - name: Set up Java for the Kotlin engine
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the actual Kotlin Nlm engine adapter
        run: |
          set -euo pipefail
          gradle -p training/engine --no-daemon build

      - name: Train the actual Kotlin GRU engine and produce NLM2 weights
        run: |
          set -euo pipefail
          OUTPUT_WEIGHTS="$GITHUB_WORKSPACE/nlm2.bin"
          mkdir -p "$GITHUB_WORKSPACE"
          gradle -p training/engine --no-daemon run --args="train --corpus $GITHUB_WORKSPACE/.training-tmp/combined-corpus.txt --conversations $GITHUB_WORKSPACE/.training-tmp/conversations-with-geometry-physics.json --conversation-repeats 3 --epochs ${{ inputs.epochs }} --learning-rate ${{ inputs.learning_rate }} --output $GITHUB_WORKSPACE/nlm2.bin --report $GITHUB_WORKSPACE/training-report.json"

      - name: Verify generated NLM2 weights with the same Kotlin engine
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/nlm2.bin"
          sha256sum "$GITHUB_WORKSPACE/nlm2.bin"
          gradle -p training/engine --no-daemon run --args="verify --weights $GITHUB_WORKSPACE/nlm2.bin"

      - name: Run Arabic QA probes (80 questions, character-model metric)
        run: |
          set -euo pipefail
          gradle -p training/engine --no-daemon run --args="qa --weights $GITHUB_WORKSPACE/nlm2.bin --questions $GITHUB_WORKSPACE/training/qa_questions.json --conversations $GITHUB_WORKSPACE/.training-tmp/conversations-with-geometry-physics.json --minimum-questions 80 --report $GITHUB_WORKSPACE/qa-report.json"
          test -s "$GITHUB_WORKSPACE/qa-report.json"

      - name: Generate visible answers for held-out Arabic conversation questions
        run: |
          set -euo pipefail
          gradle -p training/engine --no-daemon run --args="qa --weights $GITHUB_WORKSPACE/nlm2.bin --questions $GITHUB_WORKSPACE/training/holdout_questions.json --conversations $GITHUB_WORKSPACE/.training-tmp/conversations-with-geometry-physics.json --minimum-questions 20 --report $GITHUB_WORKSPACE/smoke-test-report.json"
          test -s "$GITHUB_WORKSPACE/smoke-test-report.json"
          echo "Generated answers:"
          cat "$GITHUB_WORKSPACE/smoke-test-report.json"

      - name: Evaluate model on 30 general questions
        run: |
          set -euo pipefail
          gradle -p training/engine --no-daemon run --args="qa --weights $GITHUB_WORKSPACE/nlm2.bin --questions $GITHUB_WORKSPACE/.training-tmp/general-questions.json --conversations $GITHUB_WORKSPACE/.training-tmp/conversations-with-geometry-physics.json --minimum-questions 39 --report $GITHUB_WORKSPACE/general-39-report.json"
          test -s "$GITHUB_WORKSPACE/general-39-report.json"
          echo "39-question evaluation results:"
          cat "$GITHUB_WORKSPACE/general-39-report.json"

      - name: Commit verified weights and reports to repository root
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nlm2.bin training-report.json qa-report.json smoke-test-report.json general-39-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save trained NLM2 weights and Arabic smoke-test outputs'
            git push origin HEAD:main
          else
            echo 'Weights and reports are unchanged; verifying the already committed root weights.'
          fi
          git fetch origin main
          LOCAL_BLOB="$(git hash-object "$GITHUB_WORKSPACE/nlm2.bin")"
          REMOTE_BLOB="$(git rev-parse origin/main:nlm2.bin)"
          test "$LOCAL_BLOB" = "$REMOTE_BLOB"
          git ls-tree -l origin/main nlm2.bin
          echo "Confirmed: root/nlm2.bin is committed on origin/main (blob $REMOTE_BLOB)."


      - name: Cleanup temporary corpus (always)
        if: always()
        run: |
          rm -rf .training-tmp
          echo 'Temporary corpus deleted.'
