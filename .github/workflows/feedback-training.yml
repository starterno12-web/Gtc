name: Feedback Training

on:
  workflow_dispatch:
    inputs:
      read_times:
        description: Initial training passes
        required: false
        default: "500"
      max_retries:
        description: Retry count (0 means unlimited)
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run feedback training
        run: |
          python scripts/feedback_train.py --read-times "${{ inputs.read_times }}" --max-retries "${{ inputs.max_retries }}"
      - name: Commit trained weights and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nlm2_feedback.bin nlm2_feedback.feedback_report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No training outputs to commit."
          else
            git commit -m "Save feedback training checkpoint"
            git push
          fi
