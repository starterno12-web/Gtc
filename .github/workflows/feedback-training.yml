name: Feedback Training

on:
  workflow_dispatch:
    inputs:
      read_times:
        description: Initial training passes
        required: false
        default: "500"
      max_retries:
        description: Retry count (finite default for safe training)
        required: false
        default: "25"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore NLM2 GRU source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nuwaa/lm
          curl -fsSL https://raw.githubusercontent.com/starterno12-web/Gtc/3390a7729b2acc7bee1eb94ada2b1fd963a145d9/nuwaa/lm/gru.py -o nuwaa/lm/gru.py
          test -s nuwaa/lm/gru.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run feedback training
        run: |
          python scripts/feedback_train.py --read-times "${{ inputs.read_times }}" --max-retries "${{ inputs.max_retries }}"
      - name: Commit trained weights and report
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp nlm2_feedback.bin nlm2.bin
          cp nlm2_feedback.bin android/app/src/main/assets/nlm2.bin
          git add nlm2.bin android/app/src/main/assets/nlm2.bin nlm2_feedback.bin nlm2_feedback.feedback_report.json
          if git diff --cached --quiet; then
            echo "No training outputs to commit."
          else
            git commit -m "Save feedback training checkpoint"
            git push
          fi
