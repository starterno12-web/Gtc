name: Arabic NLM Weight Training
on:
  workflow_dispatch:
  push:
    paths:
      - 'training/run_arabic_model.py'
      - 'النموذج_نسخة_محدثة__1_ (1).kt'
      - 'src/main/assets/arabic_language_training.txt'
      - 'runner/**'
      - '.github/workflows/arabic-model-training.yml'
permissions:
  contents: write
concurrency:
  group: arabic-nlm-training
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate JVM harness from the repository's actual NLM class
        run: python training/run_arabic_model.py
      - name: Compile and train actual NLM weights
        run: |
          cd runner
          gradle --no-daemon run
          cd ..
      - name: Persist trained weights in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/model/nlm2_user.bin training/model/results.txt
          git commit -m "Train NLM weights on Arabic language corpus"
          git push
      - name: Upload training results and weights
        uses: actions/upload-artifact@v4
        with:
          name: arabic-nlm-trained-model
          path: |
            training/model/nlm2_user.bin
            training/model/results.txt
          if-no-files-found: error
