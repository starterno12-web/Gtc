name: Validate NLM2 training code

on:
  push:
    paths:
      - '.github/workflows/validate-nlm2.yml'
      - '.gradle-check/src/main/kotlin/ai/nuwaa/TrainRunner.kt'
      - '.gradle-check/build.gradle.kts'
      - '.gradle-check/extract_engine.py'
      - 'النموذج_نسخة_محدثة (4).kt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Extract the exact NLM2 engine source
        run: python3 .gradle-check/extract_engine.py

      - name: Compile and run the numerical gradient check
        run: gradle -p .gradle-check --no-daemon run --args=gradcheck
