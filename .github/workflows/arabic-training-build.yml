name: Arabic Training Workflow Checks

on:
  workflow_dispatch:
  push:
    paths:
      - "النموذج_نسخة_محدثة__1_ (1).kt"
      - "src/main/assets/arabic_language_training.txt"
      - "src/main/assets/train.txt"
      - "assets/**"
      - "training/**"
      - ".github/workflows/arabic-training-build.yml"

permissions:
  contents: read

jobs:
  validate-training-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Arabic corpus, ten QA pairs, and NLM training wiring
        run: python training/validate_training_assets.py
