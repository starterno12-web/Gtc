name: Arabic Training (Server Only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'training/arabic_language_training.txt'
      - 'assets/arabic_language_training.txt'
      - 'src/main/assets/arabic_language_training.txt'
      - '.github/workflows/arabic-training-build.yml'

permissions:
  contents: read

jobs:
  verify-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and validate the full Arabic corpus
        run: |
          set -euo pipefail
          CORPUS=""
          for candidate in training/arabic_language_training.txt assets/arabic_language_training.txt src/main/assets/arabic_language_training.txt; do
            if [ -s "$candidate" ]; then CORPUS="$candidate"; break; fi
          done
          if [ -z "$CORPUS" ]; then
            echo "::error::Arabic training corpus missing or empty."
            exit 1
          fi
          echo "Corpus source: $CORPUS"
          wc -l -c "$CORPUS"
          python3 - "$CORPUS" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")
          if not text.strip():
              raise SystemExit("::error::Corpus is empty")
          print(f"Full UTF-8 source read successfully: {len(text)} characters.")
          print("Preview (first 500 chars):")
          print(text[:500])
          PY

      - name: Confirm training runtime and model weights are present
        run: |
          set -euo pipefail
          echo "Checking repository for model/runtime assets..."
          find . -type f \( -name 'nlm2.bin' -o -name '*.bin' -o -name 'gradlew' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print
          if ! find . -type f -name 'nlm2.bin' -print -quit | grep -q .; then
            echo "::warning::The engine references nlm2.bin, but no pretrained nlm2.bin weight file is currently present in the repository tree. Actual model training cannot start until that asset and an executable runner are available."
          fi
          if [ ! -f gradlew ] || { [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; }; then
            echo "::warning::No Android Gradle project runner is present. This workflow does not build APK/AAB."
          fi
