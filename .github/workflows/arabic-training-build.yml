name: Arabic Language Model Training

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-existing-model:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify actual model engine and permanent starting weights exist
        run: |
          test -f "النموذج_نسخة_محدثة__1_ (1).kt" || { echo "::error::Original Kotlin engine file missing."; exit 1; }
          if [ ! -f "nlm2.bin" ] && [ ! -f "nlm2_user.bin" ]; then
            echo "::error::Real NLM2 model weights are missing from repository root. Refusing to run pseudo-training or create fake weights."
            exit 1
          fi
          echo "Engine file exists. Real NLM2 starting weights found."
          echo "::error::Training runner for the Android-coupled NLM engine is not yet wired. No training was performed; this workflow intentionally stops instead of producing fake results."
          exit 1
