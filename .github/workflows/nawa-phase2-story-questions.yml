name: Phase 2 - Nawa Story Memory Questions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require persisted Phase 1 weights
        run: test -s training/model/nlm2_user.bin
      - name: Generate question-only harness
        run: python training/run_nawa_phase2_questions.py
      - name: Ask without training or modifying weights
        run: cd runner && gradle --no-daemon run
      - name: Save question answers as evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: nawa-phase2-memory-check
          path: training/model/results_phase2_questions.txt
          if-no-files-found: error