name: Arabic Article QA Generation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/main/assets/arabic_language_training.txt"
      - "training/generate_article_questions.py"
      - ".github/workflows/arabic-article-qa.yml"

permissions:
  contents: read

jobs:
  generate-article-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate ten questions and source-grounded answers
        run: python training/generate_article_questions.py
      - name: Upload generated QA dataset
        uses: actions/upload-artifact@v4
        with:
          name: arabic-article-qa
          path: training/generated_article_qa.json
          if-no-files-found: error
