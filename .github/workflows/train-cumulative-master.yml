name: Single cumulative master training (durable checkpoints)
on:
  push:
    branches: [main]
    paths:
      - "data/**/*.jsonl"
      - "training/**/*.jsonl"
  workflow_dispatch:
    inputs:
      epochs:
        description: Additional epochs to train (resumes automatically)
        default: "40"
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: cumulative-game-ai-training
  cancel-in-progress: false
jobs:
  train-master:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install training dependencies
        run: pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Restore first completed historical training checkpoint
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: game-domain-gru-checkpoint
          run-id: 44493771599
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: training/checkpoints/seed-first/
      - name: Restore second completed historical training checkpoint
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: game-domain-gru-checkpoint
          run-id: 44494562902
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: training/checkpoints/seed-second/
      - name: Preserve existing corpus and seed checkpoints
        run: python training/prepare_master_training.py prepare
      - name: Train the cumulative master model and commit every completed epoch
        run: |
          EPOCHS="${{ github.event_name == 'push' && '1' || github.event.inputs.epochs || '40' }}"
          python training/train_master_gru.py --epochs "$EPOCHS" --checkpoint training/checkpoints/game_domain_master.pt --persist-each-epoch
      - name: Verify durable checkpoint and corpus before publishing
        run: |
          python training/prepare_master_training.py finalize
          python - <<'PY'
          import json, pathlib, torch
          corpus=pathlib.Path("training/master_training_corpus.jsonl")
          manifest=json.loads(pathlib.Path("training/master_training_manifest.json").read_text(encoding="utf-8"))
          ck=torch.load("training/checkpoints/game_domain_master.pt",map_location="cpu",weights_only=False)
          assert corpus.exists() and corpus.stat().st_size > 0
          assert manifest["records"] > 0
          assert ck.get("optimizer_state") is not None
          assert ck.get("completed_epochs",0) > 0
          assert pathlib.Path("training/checkpoints/game_domain_master_candidate.pt").exists()
          print("PUBLISH CHECK PASSED:", manifest["records"], "records;", ck["completed_epochs"], "epochs")
          PY
      - name: Save complete outputs as a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-master-training-output
          path: |
            training/master_training_corpus.jsonl
            training/master_training_manifest.json
            training/checkpoints/game_domain_master_initial.pt
            training/checkpoints/game_domain_master.pt
            training/checkpoints/game_domain_master_candidate.pt
          retention-days: 90
      - name: Commit final corpus, manifest, and both model snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/master_training_corpus.jsonl training/master_training_manifest.json training/checkpoints/game_domain_master_initial.pt training/checkpoints/game_domain_master.pt training/checkpoints/game_domain_master_candidate.pt
          git diff --cached --quiet || git commit -m "[cumulative-train] save corpus and master model outputs"
          git push
