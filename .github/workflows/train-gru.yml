name: Train and persist NLM2 game-development model

on:
  push:
    branches: [main]
    paths:
      - "training/trigger-training.json"
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        required: false
        default: "12"
      lr:
        description: Adam learning rate
        required: false
        default: "0.0003"
      seconds:
        description: Maximum training seconds
        required: false
        default: "16000"

permissions:
  contents: write

concurrency:
  group: nuwaa-nlm2-training
  cancel-in-progress: false

jobs:
  train:
    name: Train, validate, commit, and verify persisted weights
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Train the two-layer NLM2 model
        env:
          TRAIN_EPOCHS: ${{ inputs.epochs }}
          TRAIN_LR: ${{ inputs.lr }}
          TRAIN_SECONDS: ${{ inputs.seconds }}
        run: |
          set -euo pipefail
          EPOCHS="${TRAIN_EPOCHS:-12}"
          LR="${TRAIN_LR:-0.0003}"
          LIMIT="${TRAIN_SECONDS:-16000}"
          python -m nuwaa.lm.pretrain_gru --data . --out weights/nlm2.npz --bin nlm2.bin --epochs "$EPOCHS" --lr "$LR" --seconds "$LIMIT"
          test -s nlm2.bin
          test -s weights/nlm2.npz
          cp weights/nlm2.npz nlm2.npz
          test -s nlm2.npz

      - name: Validate trained checkpoint and Android copy
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from nuwaa.lm.gru import GRULM
          root = Path("nlm2.bin")
          m = GRULM.from_bytes(root.read_bytes())
          assert root.stat().st_size > 1000, "root nlm2.bin is missing or too small"
          assert len(m.chars) > 100, f"vocabulary unexpectedly small: {len(m.chars)}"
          assert all(np.isfinite(x).all() for x in m.P), "non-finite model weights"
          npz = np.load("nlm2.npz")
          assert len(npz.files) == 9, "root NPZ does not contain all nine parameter arrays"
          asset = Path("android/app/src/main/assets/nlm2.bin")
          asset.parent.mkdir(parents=True, exist_ok=True)
          asset.write_bytes(root.read_bytes())
          restored = GRULM.from_bytes(asset.read_bytes())
          assert restored.to_bytes() == root.read_bytes(), "Android asset differs from root checkpoint"
          print(f"Checkpoint validated: {root.stat().st_size} bytes; vocab={m.v}; embed={m.e}; hidden={m.h}")
          PY

      - name: Commit weights to Git and verify remote persistence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, datetime
          from pathlib import Path
          p = Path("training_history.json")
          history = json.loads(p.read_text(encoding="utf-8")) if p.exists() else []
          history.append({
              "date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "workflow": "Train and persist NLM2",
              "epochs": "${{ inputs.epochs || '12' }}",
              "learning_rate": "${{ inputs.lr || '0.0003' }}",
              "weights": ["nlm2.bin", "nlm2.npz", "weights/nlm2.npz"],
              "format": "NLM2",
              "status": "trained-and-roundtrip-validated"
          })
          p.write_text(json.dumps(history, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY
          git config user.name "nuwaa-trainer"
          git config user.email "actions@users.noreply.github.com"
          git add nlm2.bin nlm2.npz weights/nlm2.npz android/app/src/main/assets/nlm2.bin training_history.json
          git diff --cached --quiet && { echo "::error::No trained weights or history were staged; refusing success."; exit 1; }
          git commit -m "Train and persist NLM2 model weights"
          git push origin HEAD:main
          git fetch origin main
          REMOTE_COMMIT="$(git rev-parse origin/main)"
          LOCAL_COMMIT="$(git rev-parse HEAD)"
          test "$REMOTE_COMMIT" = "$LOCAL_COMMIT"
          for file in nlm2.bin nlm2.npz weights/nlm2.npz android/app/src/main/assets/nlm2.bin training_history.json; do
            git cat-file -e "origin/main:$file" || { echo "::error::Missing persisted file on origin/main: $file"; exit 1; }
            git show "origin/main:$file" > "/tmp/remote-$(basename "$file")"
            test -s "/tmp/remote-$(basename "$file")" || { echo "::error::Remote file is empty: $file"; exit 1; }
          done
          cmp -s nlm2.bin /tmp/remote-nlm2.bin
          cmp -s nlm2.npz /tmp/remote-nlm2.npz
          cmp -s weights/nlm2.npz /tmp/remote-nlm2.npz
          cmp -s android/app/src/main/assets/nlm2.bin /tmp/remote-nlm2.bin
          echo "PERSISTENCE VERIFIED: commit $REMOTE_COMMIT contains root weights and Android asset."
