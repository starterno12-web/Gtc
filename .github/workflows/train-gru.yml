name: Train the GRU engine (resumes, never regresses, records benchmark history)
# Manual run. It (1) RESUMES from the model shipped in the app, never from scratch, with a LOW learning rate
# (a high one measurably damages a trained model), (2) measures old vs new on a fixed held-out test,
# (3) only replaces nlm2.bin if the new one is not worse, and (4) appends the result to benchmark_history.json
# (the TV page draws that file as the performance chart).
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "max epochs"
        default: "40"
      lr:
        description: "learning rate - keep it LOW when resuming"
        default: "0.0003"
      seconds:
        description: "training time budget in seconds (the job limit is ~21000)"
        default: "16000"
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy

      - name: Prepare (helper scripts, a copy of the current model, a resumable .npz of it)
        run: |
          cat > /tmp/bench_history.py <<'PY'
          """Measure the GRU model on the held-out benchmark and append ONE record to a history file.
          Strict, reproducible definition of "error" (the same one used all along in this project):
            code prompts   -> the generated code must really run and pass its assert test
                              (executed in a separate process with a timeout, never in-process)
            arabic/chat    -> the reply must contain at least one of the expected answers
          error_pct = failed / total * 100  (LOWER is better). Only 14 questions: small moves are noise."""
          import sys, os, json, subprocess, tempfile, argparse, datetime
          sys.path.insert(0, ".")
          from nuwaa.lm.gru import GRULM, Session

          def extract_code(text):
              if "```" not in text:
                  return text
              block = text.split("```")[1]
              first, _, rest = block.partition("\n")
              return rest if first.strip().isalpha() and rest else block

          def passes(code, test, timeout=5):
              d = tempfile.mkdtemp(prefix="bench_")
              p = os.path.join(d, "t.py")
              with open(p, "w", encoding="utf-8") as f:
                  f.write(code + "\n" + test + "\n")
              try:
                  return subprocess.run([sys.executable, "-I", p], cwd=d, capture_output=True, timeout=timeout).returncode == 0
              except Exception:
                  return False

          def evaluate(bin_path, bench_path="data/eval/benchmark.jsonl"):
              s = Session(GRULM.from_bytes(open(bin_path, "rb").read()), seed=1)
              items = [json.loads(l) for l in open(bench_path, encoding="utf-8") if l.strip()]
              failed, by_cat = 0, {}
              for it in items:
                  try:
                      reply, _ = s.reply(it["user"], max_chars=200, learn=False)
                  except Exception:
                      reply = ""
                  ok = passes(extract_code(reply), it["test"]) if it["category"] == "code" else any(e in reply for e in it.get("expect", []))
                  c = by_cat.setdefault(it["category"], [0, 0]); c[1] += 1
                  if not ok:
                      failed += 1; c[0] += 1
              return {"error_pct": round(failed / len(items) * 100, 1), "failed": failed, "total": len(items),
                      "by_category": {k: {"failed": v[0], "total": v[1]} for k, v in by_cat.items()},
                      "size_mb": round(os.path.getsize(bin_path) / 1e6, 2)}

          def now():
              return datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M")

          def append_record(path, rec):
              hist = []
              if os.path.exists(path):
                  try: hist = json.load(open(path, encoding="utf-8"))
                  except ValueError: hist = []
              hist.append(rec)
              json.dump(hist, open(path, "w", encoding="utf-8"), ensure_ascii=False, indent=1)

          if __name__ == "__main__":
              ap = argparse.ArgumentParser()
              ap.add_argument("--bin", required=True); ap.add_argument("--label", required=True)
              ap.add_argument("--history", default="benchmark_history.json")
              a = ap.parse_args()
              rec = evaluate(a.bin); rec.update({"label": a.label, "date": now(), "accepted": ""})
              append_record(a.history, rec); print(json.dumps(rec, ensure_ascii=False))
          PY
          cat > /tmp/gate.py <<'PY'
          import sys, os, json, shutil
          sys.path.insert(0, "."); sys.path.insert(0, "/tmp")
          import bench_history as bh
          from nuwaa.lm.gru import GRULM
          from nuwaa.lm.corpus import all_pairs, fmt

          BEFORE, AFTER = "/tmp/nlm2_before.bin", "/tmp/nlm2_after.bin"
          SHIPPED = "android/app/src/main/assets/nlm2.bin"
          EPOCHS, LR = sys.argv[1], sys.argv[2]
          if not os.path.exists(AFTER):
              print("training produced no file"); sys.exit(1)

          old = GRULM.from_bytes(open(BEFORE, "rb").read()); new = GRULM.from_bytes(open(AFTER, "rb").read())
          common = set(old.chars) & set(new.chars)          # same text for both models, or the comparison is unfair
          text = "".join(c for c in "".join(fmt(*p) for p in all_pairs("data")[::7]) if c in common)
          b_old = old.bpc(old.encode(text, grow=False)); b_new = new.bpc(new.encode(text, grow=False))
          e_old = bh.evaluate(BEFORE)["error_pct"]
          rec = bh.evaluate(AFTER)
          # NEVER-REGRESS GATE: the new model replaces the shipped one only if it is not worse on BOTH checks:
          #   1) bits/char on the corpus must not go up (it still knows what it knew)
          #   2) benchmark error must not rise by MORE THAN ONE QUESTION. Only 14 questions exist, so a single flipped
          #      answer (7.1 points) is noise, not regression (a measured run improved bits/char 0.712 -> 0.684 yet lost
          #      one question and was wrongly refused under a zero-tolerance rule). Set TOL = 0 for the strict version.
          TOL = 100.0 / rec["total"]
          accepted = (b_new <= b_old) and (rec["error_pct"] <= e_old + TOL + 1e-9)
          rec.update({"label": "تدريب " + EPOCHS + " حقبة (lr=" + LR + ")", "date": bh.now(), "accepted": "true" if accepted else "false",
                      "epochs": EPOCHS, "bits_before": round(b_old, 3), "bits_after": round(b_new, 3)})
          bh.append_record("benchmark_history.json", rec)
          if accepted:
              shutil.copy(AFTER, SHIPPED)
          msg = ("ACCEPTED" if accepted else "REJECTED (worse - the old model stays)") + \
                f": bits/char {b_old:.3f} -> {b_new:.3f} | benchmark error {e_old}% -> {rec['error_pct']}%"
          print(msg)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("### " + msg + "\n")
          PY
          cp android/app/src/main/assets/nlm2.bin /tmp/nlm2_before.bin
          python -c "import sys; sys.path.insert(0, '.'); from nuwaa.lm.gru import GRULM; GRULM.from_bytes(open('/tmp/nlm2_before.bin', 'rb').read()).save('/tmp/init.npz')"

      - name: Baseline record (first run only, so the chart has a starting point)
        run: |
          if [ ! -f benchmark_history.json ]; then
            python /tmp/bench_history.py --bin /tmp/nlm2_before.bin --label "الأساس قبل أي تدريب" --history benchmark_history.json
          fi

      - name: Train (resumes from the shipped weights)
        run: |
          python -m nuwaa.lm.pretrain_gru --data data --out weights/nlm2.npz --bin /tmp/nlm2_after.bin --init /tmp/init.npz --epochs ${{ inputs.epochs }} --lr ${{ inputs.lr }} --seconds ${{ inputs.seconds }}

      - name: Never-regress gate + record the result
        run: python /tmp/gate.py "${{ inputs.epochs }}" "${{ inputs.lr }}"

      - name: Commit (only nlm2.bin if accepted, plus the history)
        run: |
          git config user.name "nuwaa-trainer"
          git config user.email "actions@users.noreply.github.com"
          git add benchmark_history.json android/app/src/main/assets/nlm2.bin
          git diff --cached --quiet || git commit -m "GRU training run (see benchmark_history.json)"
          git push
