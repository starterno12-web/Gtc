name: Comprehensive Arabic browser and 3D curriculum training
on:
  push:
    branches: [main]
    paths:
      - 'scripts/train_article_curriculum.py'
      - '.github/workflows/train-article-curriculum.yml'
      - 'مرجع_الغمر_الشامل_المنضبط_الإصدار_الثاني.txt'
permissions:
  contents: write
jobs:
  train-article:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install training dependencies
        run: python -m pip install --no-cache-dir numpy torch
      - name: Train from v2 reference and its generated comprehension questions
        run: python scripts/train_article_curriculum.py --article 'مرجع_الغمر_الشامل_المنضبط_الإصدار_الثاني.txt' --rounds 10 --seconds 21000
      - name: Verify checkpoint exists and preserve original weights
        run: |
          test -s weights/nlm2_article_curriculum.bin
          git diff --exit-code HEAD -- nlm2.bin weights/nlm2.npz
          ls -lh weights/nlm2_article_curriculum.bin
      - name: Commit trained checkpoint permanently to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f weights/nlm2_article_curriculum.bin
          git commit -m "Save comprehensive Arabic browser and 3D checkpoint"
          git push
