<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نواة — شاشة العرض</title>
<style>
  :root{--bg:#121212;--panel:#1c1c1c;--line:#333;--text:#eee;--accent:#4ec9b0;--err:#f14c4c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,sans-serif;min-height:100vh}
  #pin-screen{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  #pin-screen h1{font-size:28px;margin:0;color:var(--accent)}
  #pin{font-size:96px;font-weight:bold;letter-spacing:16px;background:var(--panel);padding:20px 40px;border-radius:16px}
  #pin-hint{font-size:18px;opacity:.8}
  #app{display:none;height:100vh;flex-direction:column;padding:20px;gap:16px}
  #app header{font-size:20px;color:var(--accent);display:flex;justify-content:space-between}
  .col{flex:1;display:flex;gap:16px;min-height:0}
  .panel{flex:1;background:var(--panel);border-radius:12px;padding:14px;overflow:auto;display:flex;flex-direction:column}
  .panel h3{margin:0 0 10px;font-size:16px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .msg{padding:8px 12px;border-radius:8px;margin-bottom:8px;white-space:pre-wrap;font-size:16px}
  .u{background:#2b5278;align-self:flex-end}
  .b{background:#2d2d2d}
  #think-log{font-family:monospace;font-size:14px;flex:1;overflow:auto}
  #think-log div{padding:3px 0;border-bottom:1px dashed #2a2a2a}
  #file-panel iframe{width:100%;height:100%;border:0;background:#fff;border-radius:8px}
  #file-text{white-space:pre-wrap;font-family:monospace;font-size:13px}
  #status{position:fixed;top:10px;left:10px;font-size:12px;opacity:.6}
  .rate{display:flex;gap:8px;margin-top:6px}
  .rate button{background:#2d2d2d;border:1px solid #444;color:#eee;border-radius:6px;padding:4px 12px;font-size:16px;cursor:pointer}
  .rate button:disabled{opacity:.4;cursor:default}
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);align-items:center;justify-content:center;z-index:50}
  #modal .box{background:#1c1c1c;border:1px solid #444;border-radius:12px;padding:20px;width:min(640px,92vw);display:flex;flex-direction:column;gap:10px}
  #modal textarea{background:#121212;color:#eee;border:1px solid #444;border-radius:8px;padding:10px;font-size:16px;min-height:80px;font-family:inherit}
  #modal .row{display:flex;gap:10px;justify-content:flex-start}
  #modal .row button{font-size:16px;padding:10px 22px;border:none;border-radius:8px;cursor:pointer;color:#fff}
  #m-save{background:#0e639c} #m-save:disabled{background:#3c3c3c;cursor:default;opacity:.6} #m-cancel{background:#3c3c3c}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0e639c;color:#fff;padding:10px 20px;border-radius:8px;display:none;z-index:60;font-size:16px}
  #hist-svg{width:100%;height:150px;background:#121212;border-radius:8px}
</style>
</head>
<body>
<div id="status">غير متصل</div>
<div id="toast"></div>
<div id="modal"><div class="box">
  <h3 id="m-title" style="margin:0"></h3>
  <div id="m-hint" style="font-size:14px;opacity:.8"></div>
  <textarea id="m-reason" placeholder="اكتب السبب هنا (إجباري)..."></textarea>
  <textarea id="m-corr" placeholder="الجواب الصحيح (اختياري — لو كتبته يصير مثال تدريب)" style="display:none"></textarea>
  <div class="row"><button id="m-save" disabled>حفظ التقييم</button><button id="m-cancel">إلغاء</button></div>
</div></div>

<div id="pin-screen">
  <h1>📺 نواة — شاشة العرض</h1>
  <div id="pin">----</div>
  <div id="pin-hint">افتح تطبيق نواة في جوالك، اختر "اتصال بالتلفزيون"، واكتب هذا الرمز</div>
</div>

<div id="app">
  <header><span>🧠 نواة متصلة</span><span id="tv-name-label"></span></header>
  <div class="col">
    <div class="panel" style="flex:1.2">
      <h3>💬 المحادثة</h3>
      <div id="chat" style="flex:1;display:flex;flex-direction:column;overflow:auto"></div>
    </div>
    <div class="panel">
      <h3>🧠 التفكير</h3>
      <div id="think-log"></div>
    </div>
  </div>
  <div class="panel" id="code-panel" style="display:none;max-height:50vh;flex-direction:column">
    <h3 id="code-title">💻 كود</h3>
    <pre id="code-body" style="flex:1;overflow:auto;background:#0d1117;color:#c9d1d9;padding:14px;border-radius:8px;font-family:monospace;font-size:14px;white-space:pre-wrap;margin:0"></pre>
  </div>
  <div class="panel" id="file-panel" style="display:none;max-height:45vh">
    <h3 id="file-title">📄 ملف</h3>
    <div id="file-body" style="flex:1;overflow:auto"></div>
  </div>
  <div class="panel" id="hist-panel" style="max-height:34vh;flex:none">
    <h3>📈 سجل الأداء (نسبة الإجابات الصحيحة على اختبار ثابت) <button id="hist-refresh" style="font-size:13px;padding:2px 10px;margin-inline-start:10px;background:#3c3c3c;color:#fff;border:none;border-radius:6px;cursor:pointer">تحديث</button></h3>
    <div id="hist-summary" style="font-size:15px;margin-bottom:6px">لم يُحمَّل بعد</div>
    <svg id="hist-svg" viewBox="0 0 600 150"></svg>
  </div>
  <div style="display:flex;gap:10px">
    <input id="tv-input" type="text" placeholder="اكتب من هنا... (يعالجها الجوال، يرد عليك هنا)"
      style="flex:1;font-size:18px;padding:14px;border-radius:8px;border:1px solid #444;background:#1c1c1c;color:#eee">
    <button id="tv-mic" style="font-size:18px;padding:14px 20px;background:#3c3c3c;color:#fff;border:none;border-radius:8px;cursor:pointer" title="صوت لنص">🎤</button>
    <button id="tv-send" style="font-size:18px;padding:14px 28px;background:#0e639c;color:#fff;border:none;border-radius:8px;cursor:pointer">إرسال</button>
  </div>
</div>

<script>
// Change this default, or load the page as tv_display.html?server=wss://your-server/api/tv-ws
const SERVER_URL = new URLSearchParams(location.search).get('server') || 'wss://your-server/api/tv-ws';
const ws = new WebSocket(SERVER_URL);
const statusEl = document.getElementById('status');

ws.onopen = () => {
  statusEl.textContent = 'يسجّل كشاشة عرض...';
  ws.send(JSON.stringify({type: 'register_tv_host', tvName: 'تلفاز نواة'}));
};

ws.onerror = () => { statusEl.textContent = 'تعذر الاتصال بالسيرفر: ' + SERVER_URL; };

ws.onmessage = (ev) => {
  const data = JSON.parse(ev.data);
  if(data.type === 'tv_registered'){
    document.getElementById('pin').textContent = data.code;
    statusEl.textContent = 'بانتظار الجوال...';
  } else if(data.type === 'controller_joined'){
    statusEl.textContent = 'متصل: ' + data.controllerName;
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadHistory();
  } else if(data.type === 'controller_command'){
    handleCommand(data.command);
  }
};

// ctx = {user, bot} on model replies -> shows 👍/👎. A rating is NEVER sent without a written reason.
function addMsg(text, cls, ctx){
  const chat = document.getElementById('chat');
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  el.style.alignSelf = cls === 'u' ? 'flex-end' : 'flex-start';
  if(ctx){
    const row = document.createElement('div'); row.className = 'rate';
    for(const [icon, rating] of [['👍','good'],['👎','bad']]){
      const b = document.createElement('button'); b.textContent = icon;
      b.onclick = () => openRating(rating, ctx, row);
      row.appendChild(b);
    }
    el.appendChild(row);
  }
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function toast(msg, ms){
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms || 3500);
}

// ---- rating with MANDATORY reason ----
let pending = null;            // {rating, ctx, row}
const mReason = document.getElementById('m-reason'), mCorr = document.getElementById('m-corr'), mSave = document.getElementById('m-save');
function openRating(rating, ctx, row){
  pending = {rating, ctx, row};
  document.getElementById('m-title').textContent = rating === 'good' ? '👍 ليش الرد كان جيد؟' : '👎 وش الغلط بالرد؟';
  document.getElementById('m-hint').textContent = 'السبب إجباري (5 أحرف على الأقل) — بدونه ما ينحفظ التقييم.';
  mReason.value = ''; mCorr.value = '';
  mCorr.style.display = rating === 'bad' ? 'block' : 'none';
  mSave.disabled = true;
  document.getElementById('modal').style.display = 'flex';
  mReason.focus();
}
mReason.addEventListener('input', () => { mSave.disabled = mReason.value.trim().length < 5; });
document.getElementById('m-cancel').onclick = () => { document.getElementById('modal').style.display = 'none'; pending = null; };
mSave.onclick = () => {
  if(!pending || mReason.value.trim().length < 5) return;          // belt and braces: the button is already disabled
  const {rating, ctx, row} = pending;
  ws.send(JSON.stringify({type: 'tv_input', command: {action: 'feedback', rating,
    reason: mReason.value.trim(), correction: rating === 'bad' ? mCorr.value.trim() : '', user: ctx.user, bot: ctx.bot}}));
  row.querySelectorAll('button').forEach(b => b.disabled = true);
  document.getElementById('modal').style.display = 'none'; pending = null;
  toast('⏳ أرسلت التقييم للجوال... بانتظار تأكيد الحفظ');
  clearTimeout(openRating._w);
  openRating._w = setTimeout(() => toast('⚠ ما وصل تأكيد من الجوال (تأكد من تعديل server.ts)', 6000), 7000);
};

function addThinkLine(line){
  const log = document.getElementById('think-log');
  const el = document.createElement('div');
  el.textContent = line;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

// File preview is ALWAYS optional/manual (press-to-run), never automatic — exactly as asked.
function showFile(name, content, runnable){
  const panel = document.getElementById('file-panel');
  const body = document.getElementById('file-body');
  panel.style.display = 'flex';
  body.innerHTML = '';
  if(runnable){
    document.getElementById('file-title').textContent = '📄 ' + name + ' — جاهز';
    const btn = document.createElement('button');
    btn.textContent = '▶ تشغيل ومعاينة';
    btn.style.cssText = 'font-size:18px;padding:14px 28px;background:#0e639c;color:#fff;border:none;border-radius:8px;cursor:pointer;align-self:flex-start';
    btn.onclick = () => renderFile(name, content);
    body.appendChild(btn);
  } else {
    // not browser-runnable (e.g. .py) — show the real written content as text, no fake "run"
    document.getElementById('file-title').textContent = '📄 ' + name + ' — (مو كود متصفح، معاينة نصية فقط)';
    const pre = document.createElement('div');
    pre.id = 'file-text'; pre.textContent = content;
    body.appendChild(pre);
  }
}

function renderFile(name, content){
  const body = document.getElementById('file-body');
  document.getElementById('file-title').textContent = '📄 ' + name + ' — يشتغل الآن (محرك المتصفح نفسه، بدون أي سيرفر)';
  body.innerHTML = '';
  const ext = name.split('.').pop().toLowerCase();
  if(['html','htm'].includes(ext)){
    const errCatcher = `<script>window.onerror=function(m,s,l){document.title='JS ERROR: '+m+' @'+l;}<\/script>`;
    const iframe = document.createElement('iframe');
    iframe.srcdoc = errCatcher + content;
    body.appendChild(iframe);
  } else if(ext === 'js'){
    const iframe = document.createElement('iframe');
    iframe.srcdoc = `<script>${content}<\/script>`;
    body.appendChild(iframe);
  } else if(ext === 'css'){
    const iframe = document.createElement('iframe');
    iframe.srcdoc = `<style>${content}</style><body style="font-family:sans-serif;padding:20px">معاينة التنسيق</body>`;
    body.appendChild(iframe);
  } else {
    const pre = document.createElement('div');
    pre.id = 'file-text'; pre.textContent = content;
    body.appendChild(pre);
  }
}

// Typing directly on the TV: sent as 'tv_input' over this TV's own socket (role='tv').
// NEEDS a small addition on the pairing server to relay it to the phone — see README's server.ts patch.
// Without that addition, this button sends but nothing reaches the phone (fails silently -> no reply).
document.getElementById('tv-send').onclick = () => {
  const el = document.getElementById('tv-input');
  const text = el.value.trim();
  if (!text) return;
  ws.send(JSON.stringify({type: 'tv_input', command: {action: 'chat_text', text}}));
  addMsg(text, 'u'); echoed.push(text);
  el.value = '';
};
document.getElementById('tv-input').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('tv-send').click(); });

// Mic button: uses the browser's own Web Speech API. On a PHONE's Chrome, this naturally opens the
// same native Google voice-to-text you already use — exactly the fallback you asked for, no separate
// code needed for that case. On a TV browser, support is genuinely uncertain (varies a lot by TV
// brand/OS) — honest, not guessing: if unsupported, the button says so instead of silently doing nothing.
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('tv-mic');
if (!SpeechRec) {
  micBtn.title = 'الصوت غير مدعوم بهذا المتصفح';
  micBtn.onclick = () => alert('ميزة تحويل الصوت لنص غير مدعومة بهذا المتصفح. جرب فتح هذي الصفحة من متصفح جوالك (كروم) بدل متصفح التلفزيون.');
} else {
  const rec = new SpeechRec();
  rec.lang = 'ar-SA';
  rec.interimResults = false;
  let listening = false;
  rec.onresult = (e) => {
    document.getElementById('tv-input').value = e.results[0][0].transcript;
  };
  rec.onend = () => { listening = false; micBtn.textContent = '🎤'; };
  rec.onerror = () => { listening = false; micBtn.textContent = '🎤'; };
  micBtn.onclick = () => {
    if (listening) { rec.stop(); return; }
    try { rec.start(); listening = true; micBtn.textContent = '🔴'; }
    catch (e) { alert('ما قدرت أشغّل المايك: ' + e.message); }
  };
}

const echoed = [];   // texts typed on the TV and already shown locally: the phone's relay must not add them a 2nd time
function handleCommand(cmd){
  if(!cmd || !cmd.action) return;
  if(cmd.action === 'feedback_saved'){
    clearTimeout(openRating._w);
    toast(cmd.ok === 'true' ? '✅ انحفظ التقييم بالجوال (' + cmd.info + ')' : '❌ ما انحفظ: ' + cmd.info, 5000);
  } else if(cmd.action === 'chat'){
    const i = echoed.indexOf(cmd.user);
    if(i >= 0) echoed.splice(i, 1); else addMsg(cmd.user, 'u');
    addMsg(cmd.bot, 'b', {user: cmd.user, bot: cmd.bot});
  } else if(cmd.action === 'thinking'){
    addThinkLine(cmd.line);
  } else if(cmd.action === 'file_done'){
    showFile(cmd.name, cmd.content, cmd.runnable === 'true');
  } else if(cmd.action === 'code'){
    // Studio view: code the model wrote in a normal chat reply, not just "create a file" — this is
    // what makes the TV a studio (you watch code appear) instead of just mirroring chat bubbles.
    document.getElementById('code-title').textContent = '💻 كود' + (cmd.language ? ' (' + cmd.language + ')' : '');
    document.getElementById('code-body').textContent = cmd.code;
    document.getElementById('code-panel').style.display = 'flex';
  }
}

// ---- 📈 performance history: reads benchmark_history.json, which the training workflow writes by itself
// after every run (so the % comes automatically, you never have to ask for it).
// Load the page with ?history=<raw github url of benchmark_history.json> if the file isn't next to this page.
const HIST_URL = new URLSearchParams(location.search).get('history') || 'benchmark_history.json';
async function loadHistory(){
  const sum = document.getElementById('hist-summary'), svg = document.getElementById('hist-svg');
  try{
    const r = await fetch(HIST_URL + (HIST_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache: 'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const h = await r.json();
    if(!Array.isArray(h) || !h.length) throw new Error('فاضي');
    drawHistory(h);
  }catch(e){
    sum.textContent = 'ما فيه سجل بعد (' + e.message + ') — يتولّد تلقائيا بعد أول تشغيل لورشة التدريب.';
    svg.innerHTML = '';
  }
}
function drawHistory(h){
  const good = x => 100 - Number(x.error_pct);            // % of benchmark answers that were right — higher is better
  // "now" = the model that is actually SHIPPED: the latest run the never-regress gate did NOT refuse.
  let curIdx = 0; h.forEach((x, i) => { if(String(x.accepted) !== 'false') curIdx = i; });
  const lastRejected = String(h[h.length - 1].accepted) === 'false';
  const first = good(h[0]), last = good(h[curIdx]);
  const d = last - first, sign = d > 0 ? '+' : '';
  const rel = first > 0 ? ' (' + sign + (d / first * 100).toFixed(0) + '% نسبيا)' : '';
  document.getElementById('hist-summary').textContent =
    'الأساس: ' + first.toFixed(1) + '% صح  ←  النسخة المعتمدة الآن: ' + last.toFixed(1) + '% صح  |  التغير: ' + sign + d.toFixed(1) + ' نقطة' + rel +
    '  |  ' + h.length + ' قياس' + (lastRejected ? '  |  ⚠ آخر تدريب انرفض (كان أسوأ) والنسخة القديمة باقية' : '') +
    '  |  الاختبار ' + h[0].total + ' سؤال فقط (كل سؤال ≈ ' + (100 / h[0].total).toFixed(1) + ' نقطة)';
  const W = 600, H = 150, L = 34, R = 12, T = 12, B = 20, n = h.length;
  const X = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1);
  const Y = v => T + (1 - v / 100) * (H - T - B);
  let g = '';
  for(const v of [0, 50, 100]) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#333"/>' +
                                   '<text x="2" y="' + (Y(v) + 4) + '" fill="#888" font-size="11">' + v + '%</text>';
  g += '<polyline fill="none" stroke="#4ec9b0" stroke-width="2" points="' + h.map((x, i) => X(i) + ',' + Y(good(x))).join(' ') + '"/>';
  h.forEach((x, i) => {
    const rejected = String(x.accepted) === 'false';       // a run the "never regress" gate refused is drawn red/hollow
    g += '<circle cx="' + X(i) + '" cy="' + Y(good(x)) + '" r="5" stroke="' + (rejected ? '#f14c4c' : '#4ec9b0') + '" stroke-width="2" fill="' + (rejected ? 'none' : '#4ec9b0') + '"/>';
  });
  g += '<text x="' + X(curIdx) + '" y="' + (Y(last) - 9) + '" text-anchor="middle" fill="#eee" font-size="12">' + last.toFixed(1) + '%</text>';
  document.getElementById('hist-svg').innerHTML = g;
}
document.getElementById('hist-refresh').onclick = loadHistory;
</script>
</body>
</html>
